[workspace]
members = ["hosts/play-host"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
getrandom = "0.3"
rpg-compiler = { git = "https://github.com/FuzzySlipper/asha-rpg.git", rev = "e4d6d1afb5b8387de4ff805d73b2041df29ee590" }
rpg-core = { git = "https://github.com/FuzzySlipper/asha-rpg.git", rev = "e4d6d1afb5b8387de4ff805d73b2041df29ee590" }
rpg-ir = { git = "https://github.com/FuzzySlipper/asha-rpg.git", rev = "e4d6d1afb5b8387de4ff805d73b2041df29ee590" }
rpg-runtime = { git = "https://github.com/FuzzySlipper/asha-rpg.git", rev = "e4d6d1afb5b8387de4ff805d73b2041df29ee590" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ts-rs = { version = "11", features = ["serde-compat"] }
